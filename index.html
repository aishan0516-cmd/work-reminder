<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作提醒 V2｜LINE 對話轉待辦</title><style>:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#1d2939;background:#f5f8fc}*{box-sizing:border-box}body{margin:0}header{background:#174c7d;color:white;padding:24px max(20px,calc((100vw - 1050px)/2))}h1{font-size:24px;margin:0 0 6px}header p{margin:0;color:#dceaf8}main{max-width:1050px;margin:auto;padding:22px 16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.panel{background:white;border:1px solid #e2e9f2;border-radius:13px;padding:17px}.stat strong{display:block;font-size:27px;color:#174c7d}.stat span{font-size:13px;color:#667085}.panel{margin-top:16px}h2{font-size:17px;margin:0 0 13px}.toolbar,.actions,.formrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input,select,textarea{font:inherit;border-radius:8px;border:1px solid #ccd7e5;padding:9px;background:white}button{cursor:pointer}button.primary{background:#1764a0;color:white;border-color:#1764a0}button.danger{color:#a11a26}input[type=text]{flex:1;min-width:180px}textarea{width:100%;min-height:65px}.task{padding:13px 0;border-bottom:1px solid #edf0f5;display:flex;gap:12px}.task:last-child{border-bottom:0}.task>input{margin-top:5px}.taskmain{flex:1;min-width:0}.tasktitle{font-weight:650}.task.done .tasktitle{text-decoration:line-through;color:#8993a2}.meta{color:#667085;font-size:12px;margin:5px 0}.desc{font-size:13px;color:#475467;white-space:pre-wrap}.tag{display:inline-block;border-radius:5px;background:#edf4fb;padding:2px 6px;margin-right:5px}.overdue{color:#b42318}.task button{font-size:12px;padding:5px 8px}.hint{font-size:12px;color:#667085;line-height:1.6}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}.field label{display:block;font-size:12px;color:#667085;margin-bottom:4px}.field input,.field select{width:100%}.hidden{display:none}dialog{border:0;border-radius:14px;box-shadow:0 16px 70px #203b5b55;max-width:600px;width:calc(100% - 28px)}dialog::backdrop{background:#10263b77}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.toolbar>*{flex:1}header{padding:20px}}</style><style>
.extract-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.extract-grid textarea{min-height:165px;width:100%}.candidate{border:1px solid #d6e1eb;border-radius:10px;padding:12px;margin:9px 0;background:#fff}.candidate input[type=text],.candidate input[type=datetime-local],.candidate select{max-width:100%;padding:7px;border:1px solid #c8d6e4;border-radius:6px}.candidate-fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:8px}.candidate .why{font-size:12px;color:#52677a;margin:6px 0}.notice{background:#fff5df;padding:10px;border-radius:8px;font-size:13px}.extract-grid button{margin-top:8px}@media(max-width:700px){.extract-grid,.candidate-fields{grid-template-columns:1fr}}
</style></head><body><header><h1>工作提醒中心</h1><p>把交辦事項變成可追蹤的下一步｜資料僅儲存在此瀏覽器</p></header><main><div class="stats" id="stats"></div><section class="panel"><div class="toolbar"><button class="primary" onclick="openForm()">＋ 新增待辦</button><button onclick="requestNotify()">啟用瀏覽器通知</button><button onclick="exportData()">備份 JSON</button><button onclick="document.getElementById('import').click()">匯入備份</button><input type="file" id="import" accept="application/json" hidden onchange="importData(event)"></div><p class="hint">通知僅在此頁開啟、瀏覽器允許通知時檢查；關閉網頁後無法保證提醒。請以行事曆作為重要期限的備援。可用「備份 JSON」將資料移到其他電腦。</p></section><section class="panel" id="extractor"><h2>從 LINE 對話擷取待辦</h2><p class="hint">離線規則辨識：不會將對話上傳到伺服器，也不會呼叫 AI。擷取結果只是候選項目，必須逐項確認才會存入待辦。</p><div class="extract-grid"><div><label for="linePaste"><strong>貼上 LINE 對話</strong></label><textarea id="linePaste" placeholder="例如：11:07 主任 請週四前確認 Adobe 10U 授權採購..." style="display:block"></textarea><div class="toolbar"><button class="primary" onclick="extractLine()">辨識待辦候選</button><button onclick="document.getElementById('linePaste').value=''">清空對話</button></div></div><div><strong>待確認候選</strong><div id="candidates"><p class="hint">貼上對話並按「辨識待辦候選」。</p></div></div></div><div class="notice">安全提醒：請先移除電話、帳號、個資及機敏資訊。這版不具備真正的語意 AI、雲端同步或關閉網頁後的推播能力。若需背景提醒，請另建立行事曆事件。</div></section><section class="panel"><div class="toolbar"><h2 style="margin-right:auto">待辦任務</h2><select id="filter" onchange="render()"><option value="open">未完成</option><option value="all">全部</option><option value="done">已完成</option></select><select id="category" onchange="render()"><option value="">所有類別</option><option>行政簽核</option><option>網站專案</option><option>採購授權</option><option>品質管理</option><option>協作會議</option></select></div><div id="tasks"></div></section></main><dialog id="editor"><form id="taskForm" onsubmit="saveTask(event)"><h2 id="formTitle">新增任務</h2><input type="hidden" id="tid"><div class="field"><label>任務名稱</label><input id="title" required maxlength="140" style="width:100%"></div><div class="formgrid"><div class="field"><label>截止日期與時間</label><input id="due" type="datetime-local"></div><div class="field"><label>優先級</label><select id="priority"><option value="高">高</option><option value="中" selected>中</option><option value="低">低</option></select></div><div class="field"><label>類別</label><select id="kind"><option>行政簽核</option><option>網站專案</option><option>採購授權</option><option>品質管理</option><option>協作會議</option></select></div></div><div class="field"><label>下一步／完成判定</label><textarea id="description"></textarea></div><div class="actions" style="justify-content:flex-end;margin-top:12px"><button type="button" onclick="editor.close()">取消</button><button class="primary" type="submit">儲存</button></div></form></dialog><script>
const KEY='work_reminder_v1';const seed=[];
let tasks;try{const raw=localStorage.getItem(KEY);tasks=raw?JSON.parse(raw):seed;if(!Array.isArray(tasks))throw Error()}catch{tasks=seed}const save=()=>localStorage.setItem(KEY,JSON.stringify(tasks));save();const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const now=new Date(),open=tasks.filter(t=>!t.done),late=open.filter(t=>t.due&&new Date(t.due)<now),soon=open.filter(t=>t.due&&new Date(t.due)>=now&&new Date(t.due)-now<86400000*3);$('stats').innerHTML=[['未完成',open.length],['已逾期',late.length],['三天內到期',soon.length],['已完成',tasks.length-open.length]].map(([a,b])=>`<div class="stat"><strong>${b}</strong><span>${a}</span></div>`).join('');let list=tasks.filter(t=>($('filter').value==='all'||($('filter').value==='done'?t.done:!t.done))&&(!$('category').value||t.kind===$('category').value));list.sort((a,b)=>Number(a.done)-Number(b.done)||(a.due?new Date(a.due).getTime():Infinity)-(b.due?new Date(b.due).getTime():Infinity)||({'高':0,'中':1,'低':2}[a.priority]-{'高':0,'中':1,'低':2}[b.priority]));$('tasks').innerHTML=list.length?list.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggle('${esc(t.id)}')" aria-label="完成任務"><div class="taskmain"><div class="tasktitle">${esc(t.title)}</div><div class="meta"><span class="tag">${esc(t.priority)}優先</span><span class="tag">${esc(t.kind)}</span>${t.due?`<span class="${!t.done&&new Date(t.due)<now?'overdue':''}">目標：${esc(t.due.replace('T',' '))}</span>`:'未設定期限'}</div><div class="desc">${esc(t.description)}</div></div><div><button onclick="openForm('${esc(t.id)}')">編輯</button><br><button class="danger" onclick="removeTask('${esc(t.id)}')">刪除</button></div></div>`).join(''):'<p class="hint">目前沒有符合條件的任務。</p>'}function toggle(id){const t=tasks.find(t=>t.id===id);if(t)t.done=!t.done;save();render()}function removeTask(id){if(confirm('確定刪除這項任務？')){tasks=tasks.filter(t=>t.id!==id);save();render()}}function openForm(id){const t=tasks.find(x=>x.id===id);$('formTitle').textContent=t?'編輯任務':'新增任務';$('tid').value=t?.id||'';$('title').value=t?.title||'';$('due').value=t?.due||'';$('priority').value=t?.priority||'中';$('kind').value=t?.kind||'行政簽核';$('description').value=t?.description||'';$('editor').showModal()}function saveTask(e){e.preventDefault();const id=$('tid').value;const t={id:id||'t'+Date.now(),title:$('title').value.trim(),due:$('due').value,priority:$('priority').value,kind:$('kind').value,description:$('description').value,done:tasks.find(t=>t.id===id)?.done||false};if(id)tasks=tasks.map(x=>x.id===id?t:x);else tasks.push(t);save();$('editor').close();render()}function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,tasks},null,2)],{type:'application/json'}));a.download='工作提醒備份_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(e){const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.tasks)||!data.tasks.every(t=>typeof t.title==='string'&&typeof t.id==='string'))throw Error('格式錯誤');if(confirm('匯入將覆蓋本機目前的任務，是否繼續？')){tasks=data.tasks;save();render()}}catch(err){alert('匯入失敗：'+err.message)}e.target.value=''}async function requestNotify(){if(!('Notification'in window)){alert('此瀏覽器不支援通知');return}const p=await Notification.requestPermission();alert(p==='granted'?'已允許通知。請保持頁面開啟以檢查到期任務。':'未取得通知權限')}const notified=new Set();function checkNotices(){if(!('Notification'in window)||Notification.permission!=='granted')return;const now=Date.now();tasks.filter(t=>!t.done&&t.due&&new Date(t.due).getTime()<=now).forEach(t=>{if(notified.has(t.id))return;notified.add(t.id);new Notification('工作提醒：'+t.title,{body:'目標時間已到，請確認處理進度。'})})}setInterval(checkNotices,60000);// LINE 對話離線候選擷取：所有候選都需人工確認。
let candidates=[];
function cleanLine(raw){return raw.replace(/^\s*(?:\d{4}[.\/-]\d{1,2}[.\/-]\d{1,2}\s*)?(?:星期[一二三四五六日天]\s*)?(?:\d{1,2}:\d{2}\s+)?(?:[^\s]{1,24}(?:\s+\d{3,8}){0,2}\s+)?/,'').trim()}
function extractLine(){
 const lines=$('linePaste').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 candidates=[];let dateContext='';
 for(let i=0;i<lines.length;i++){
  const raw=lines[i];const dateMatch=raw.match(/(?:20\d\d)[.\/-](\d{1,2})[.\/-](\d{1,2})/);if(dateMatch){dateContext=dateMatch[0];if(/星期[一二三四五六日天]/.test(raw)&&raw.length<35)continue}
  const line=cleanLine(raw);if(line.length<5||/^(OK|好|收到|謝謝|只能如此|那麼可以)/i.test(line))continue;
  const action=/(請|需要|記得|確認|盤點|採購|核銷|簽辦|協助|提供|整理|評估|修正|通知|提交|完成|待辦|要約|約時間|改良|處理|上傳|檢查|討論)/.test(line);
  if(!action)continue;
  const explicit=/(請|記得|需要|前完成|等待您的簽辦|幫我|務必|截止)/.test(line);
  const date=line.match(/(?:20\d\d[.\/-])?(\d{1,2})[\/-](\d{1,2})(?:\s*(?:前|以前))?/);
  let due='';if(date){const y=(date[0].match(/20\d\d/)||[])[0]||'2026';due=y+'-'+date[1].padStart(2,'0')+'-'+date[2].padStart(2,'0')+'T17:00'}
  // 相對日期只能在使用者核對後填寫，避免將星期幾誤認為確定日期。
  let title=line.replace(/^@[^\s]+\s*/,'').replace(/^(?:請|麻煩|記得|需要)\s*/,'').slice(0,100);
  const duplicate=tasks.some(t=>!t.done&&(t.title.includes(title.slice(0,14))||title.includes(t.title.slice(0,14))));
  candidates.push({title,description:'來源對話：'+raw+(dateContext?'\n對話日期：'+dateContext:''),due,priority:/緊急|故障|資安事件|截止|核銷|簽辦/.test(line)?'高':'中',kind:/採購|Adobe|授權/.test(line)?'採購授權':/網站|網頁|rPage|WordPress|CMS/.test(line)?'網站專案':/簽辦|核銷|報告/.test(line)?'行政簽核':'協作會議',why:(explicit?'明確交辦或期限用語':'可能的工作動作')+(duplicate?'；疑似與既有待辦重複':'')+(due?'；日期請核對':'；未辨識明確日期'),selected:explicit&&!duplicate});
 }
 if(candidates.length>20)candidates=candidates.slice(0,20);
 renderCandidates();
}
function renderCandidates(){const root=$('candidates');root.innerHTML=candidates.length?candidates.map((c,i)=>`<div class="candidate"><label><input type="checkbox" id="pick${i}" ${c.selected?'checked':''}> <strong>加入此候選</strong></label><div class="why">${esc(c.why)}</div><input type="text" id="ct${i}" value="${esc(c.title)}" aria-label="候選任務名稱" style="width:100%"><div class="candidate-fields"><input type="datetime-local" id="cd${i}" value="${esc(c.due)}" aria-label="截止時間"><select id="cp${i}" aria-label="優先級"><option ${c.priority==='高'?'selected':''}>高</option><option ${c.priority==='中'?'selected':''}>中</option><option>低</option></select><select id="ck${i}" aria-label="類別">${['行政簽核','網站專案','採購授權','品質管理','協作會議'].map(k=>`<option ${k===c.kind?'selected':''}>${k}</option>`).join('')}</select></div></div>`).join('')+'<button class="primary" onclick="saveCandidates()">儲存已勾選的候選任務</button>':'<p class="hint">未找到符合規則的候選。可以改用「新增待辦」手動建立。</p>'}
function saveCandidates(){let added=0;for(let i=0;i<candidates.length;i++){if(!$('pick'+i).checked)continue;const title=$('ct'+i).value.trim();if(!title)continue;const due=$('cd'+i).value;if(tasks.some(t=>!t.done&&t.title===title)){continue}tasks.push({id:'line'+Date.now()+'_'+i,title,due,priority:$('cp'+i).value,kind:$('ck'+i).value,description:candidates[i].description,done:false});added++}save();render();candidates=[];renderCandidates();alert('已新增 '+added+' 項。未勾選及重複標題不會新增。')}
render();</script></body></html>
